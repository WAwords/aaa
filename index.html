<!doctype html>
<html lang="zh-CN" data-theme="">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/logo.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>

    body {
      margin: 0;
    }

    .index-loading {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .index-circle {
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background-image: linear-gradient(0deg,
          rgb(1, 94, 172),
          rgb(255, 255, 255) 100%);
      animation: rotate 1s linear infinite;
    }

    /* .index-circle::before {
        content: "";
        position: absolute;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background-image: linear-gradient(
          0deg,
          rgb(1, 94, 172),
          rgb(255, 255, 255) 100%
        );
        filter: blur(35px);
      } */
    .index-circle::after {
      content: "";
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #fff;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    @keyframes rotate {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
  <title>云医教</title>
</head>

<body>
  <div id="app">
    <div class="index-loading">
      <div class="index-circle"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
